name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v7
      - run: npm ci --ignore-scripts
      - run: uv sync --frozen --python 3.12
      - run: npm run check
      - run: npm test
      - run: npm run mutations
      - run: uv run --frozen --offline python -m unittest discover -s test -p "*_test.py"
      - run: npm run smoke
